<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56" fill="none">
  <!-- neural network: connections -->
  <g stroke="#F5C84B" stroke-width="1.6" opacity="0.55">
    <line x1="28" y1="12" x2="12" y2="28"/>
    <line x1="28" y1="12" x2="44" y2="28"/>
    <line x1="12" y1="28" x2="28" y2="44"/>
    <line x1="44" y1="28" x2="28" y2="44"/>
    <line x1="12" y1="28" x2="44" y2="28"/>
    <line x1="28" y1="12" x2="28" y2="44"/>
  </g>
  <!-- nodes, pulsing in sequence -->
  <circle cx="28" cy="12" r="5" fill="#F5C84B">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="2.4s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="12" cy="28" r="5" fill="#F5C84B">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="44" cy="28" r="5" fill="#F5C84B">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="28" cy="44" r="5" fill="#F5C84B">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
