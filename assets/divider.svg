<svg xmlns="http://www.w3.org/2000/svg" width="900" height="60" viewBox="0 0 900 60" fill="none">
  <defs>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5C84B" stop-opacity="0"/>
      <stop offset="1" stop-color="#F5C84B" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5C84B" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F5C84B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- flowing brush-stroke lines -->
  <path d="M60 30 C 160 22, 270 38, 392 30" stroke="url(#fadeL)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="10 8">
    <animate attributeName="stroke-dashoffset" values="0;-72" dur="4s" repeatCount="indefinite"/>
  </path>
  <path d="M508 30 C 630 22, 740 38, 840 30" stroke="url(#fadeR)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="10 8">
    <animate attributeName="stroke-dashoffset" values="0;-72" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- van gogh curls flanking the star -->
  <path d="M418 30 c -6 -12, -22 -10, -22 2 c 0 9, 11 12, 15 4" stroke="#F5C84B" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
  <path d="M482 30 c 6 12, 22 10, 22 -2 c 0 -9, -11 -12, -15 -4" stroke="#F5C84B" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>

  <!-- pulsing center star -->
  <g transform="translate(450 30)">
    <circle r="10" fill="#F5C84B" opacity="0.22">
      <animate attributeName="r" values="8;14;8" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.1;0.25" dur="3s" repeatCount="indefinite"/>
    </circle>
    <path d="M0 -14 L3 -3 L14 0 L3 3 L0 14 L-3 3 L-14 0 L-3 -3 Z" fill="#F5C84B">
      <animateTransform attributeName="transform" type="scale" values="1;1.18;1" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- twinkling stars -->
  <circle cx="130" cy="20" r="2.4" fill="#F5C84B"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" begin="0s" repeatCount="indefinite"/></circle>
  <circle cx="235" cy="42" r="2" fill="#F5C84B"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.1s" begin="0.7s" repeatCount="indefinite"/></circle>
  <circle cx="330" cy="18" r="2.6" fill="#F5C84B"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.2s" begin="1.2s" repeatCount="indefinite"/></circle>
  <circle cx="572" cy="42" r="2.6" fill="#F5C84B"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.9s" begin="0.4s" repeatCount="indefinite"/></circle>
  <circle cx="668" cy="18" r="2" fill="#F5C84B"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.4s" begin="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="775" cy="40" r="2.4" fill="#F5C84B"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.3s" begin="0.9s" repeatCount="indefinite"/></circle>
</svg>
