<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" fill="none">
  <!-- faint corner swirls -->
  <path d="M60 50 c -18 -28, -52 -22, -52 6 c 0 22, 26 28, 36 10" stroke="#F5C84B" stroke-width="2" stroke-linecap="round" opacity="0.18"/>
  <path d="M840 290 c 18 28, 52 22, 52 -6 c 0 -22, -26 -28, -36 -10" stroke="#F5C84B" stroke-width="2" stroke-linecap="round" opacity="0.18"/>

  <!-- block 1 -->
  <text x="450" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" letter-spacing="4" fill="#F5C84B">FOUND THE EMPIRE</text>
  <text x="450" y="74" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#98A2C7">ship my own AI SaaS and scale it to the world</text>

  <!-- block 2 -->
  <text x="450" y="126" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" letter-spacing="4" fill="#F5C84B">AUTOMATE ENTIRE INDUSTRIES</text>
  <text x="450" y="152" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#98A2C7">not tasks. Whole businesses, end to end</text>

  <!-- block 3 -->
  <text x="450" y="204" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" letter-spacing="4" fill="#F5C84B">MASTER THE FRONTIER</text>
  <text x="450" y="230" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#98A2C7">agents, ML/DL, and whatever comes next</text>

  <!-- block 4 -->
  <text x="450" y="282" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" letter-spacing="4" fill="#F5C84B">KEEP ASCENDING</text>
  <text x="450" y="308" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#98A2C7">the sky was never the limit. It was the starting line</text>

  <!-- pulsing separator stars between blocks -->
  <g transform="translate(450 96)">
    <path d="M0 -6 L1.4 -1.4 L6 0 L1.4 1.4 L0 6 L-1.4 1.4 L-6 0 L-1.4 -1.4 Z" fill="#F5C84B">
      <animateTransform attributeName="transform" type="scale" values="1;1.35;1" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
  <g transform="translate(450 174)">
    <path d="M0 -6 L1.4 -1.4 L6 0 L1.4 1.4 L0 6 L-1.4 1.4 L-6 0 L-1.4 -1.4 Z" fill="#F5C84B">
      <animateTransform attributeName="transform" type="scale" values="1;1.35;1" dur="3s" begin="1s" repeatCount="indefinite"/>
    </path>
  </g>
  <g transform="translate(450 252)">
    <path d="M0 -6 L1.4 -1.4 L6 0 L1.4 1.4 L0 6 L-1.4 1.4 L-6 0 L-1.4 -1.4 Z" fill="#F5C84B">
      <animateTransform attributeName="transform" type="scale" values="1;1.35;1" dur="3s" begin="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- twinkling stars scattered -->
  <circle cx="130" cy="120" r="2.4" fill="#F5C84B"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="180" cy="240" r="2" fill="#F5C84B"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.4s" begin="0.6s" repeatCount="indefinite"/></circle>
  <circle cx="90" cy="180" r="2.6" fill="#F5C84B"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.3s" begin="1.1s" repeatCount="indefinite"/></circle>
  <circle cx="770" cy="110" r="2.4" fill="#F5C84B"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.1s" begin="0.3s" repeatCount="indefinite"/></circle>
  <circle cx="720" cy="230" r="2" fill="#F5C84B"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.6s" begin="1.4s" repeatCount="indefinite"/></circle>
  <circle cx="812" cy="170" r="2.6" fill="#F5C84B"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.6s" begin="0.9s" repeatCount="indefinite"/></circle>
</svg>
